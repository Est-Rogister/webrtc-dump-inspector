[package]
name = "rtc-inspector"
version.workspace = true
description = "A local-first WebRTC dump analyzer"
authors = ["RTC Inspector Contributors"]
edition.workspace = true
license.workspace = true

[lib]
name = "rtc_inspector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dump-reader = { path = "../../../crates/dump-reader" }
rtc-domain = { path = "../../../crates/rtc-domain" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid.workspace = true
